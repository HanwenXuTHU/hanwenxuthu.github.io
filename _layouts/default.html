<!DOCTYPE html>
<html lang="en">
<!-- Template: https://github.com/luost26/academic-homepage -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ site.data.profile.tab_name | default: site.data.profile.navbar_name }}{% unless page.url == "/" %} - {{ page.title }}{% endunless %}</title>
    <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}?v=2">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}?v=2" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}?v=2" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}?v=2">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body {{ page.body_attr }}>
    {% include navbar.html %}
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        {{content}}
    </div>
    {% include footer.html %}

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.9/jquery.lazy.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js" integrity="sha512-XKa9Hemdy1Ui3KSGgJdgMyYlUg1gM+QhL6cnlyTe2qzMCYm4nAZ1PsVerQzTTXzonUR+dmswHqgJPuwCq1MaAg==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/github-buttons/2.14.2/buttons.min.js" integrity="sha512-OYwZx04hKFeFNYrWxIyo3atgGpb+cxU0ENWBZs72X7T9U+NoHPM1ftUn/Mfw7dRDXrqWA6M1wBg6z6fGE32aeA==" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
              delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false}
              ],
              throwOnError : false
            });
        });
    </script>
    <script>
        // transparent navbar turns solid black once the page is scrolled
        document.addEventListener("DOMContentLoaded", function() {
            var nav = document.querySelector(".navbar-transparent");
            if (!nav) return;
            var onScroll = function() {
                nav.classList.toggle("navbar-scrolled", window.scrollY > 30);
            };
            window.addEventListener("scroll", onScroll, { passive: true });
            onScroll();
        });
        // collapse the mobile menu after tapping an anchor link
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll("#navbarResponsive .nav-link").forEach(function(link) {
                link.addEventListener("click", function() {
                    if (window.jQuery) { jQuery("#navbarResponsive").collapse("hide"); }
                });
            });
        });
        // scrollspy: move the navbar highlight to the section in view
        document.addEventListener("DOMContentLoaded", function() {
            var items = Array.prototype.slice.call(document.querySelectorAll("#navbarResponsive .nav-item"));
            var anchors = [];
            var homeItem = null;
            items.forEach(function(li) {
                var a = li.querySelector("a.nav-link");
                if (!a) return;
                var href = a.getAttribute("href") || "";
                var hashIdx = href.indexOf("#");
                if (hashIdx === -1) {
                    if (!homeItem) homeItem = li;
                    return;
                }
                var target = document.getElementById(href.slice(hashIdx + 1));
                if (target) anchors.push({ li: li, target: target });
            });
            if (!anchors.length) return; // sections not on this page
            var update = function() {
                var pos = 120; // just below the sticky navbar
                var current = null;
                var bestTop = -Infinity;
                anchors.forEach(function(x) {
                    var top = x.target.getBoundingClientRect().top;
                    if (top <= pos && top > bestTop) {
                        bestTop = top;
                        current = x.li;
                    }
                });
                items.forEach(function(li) { li.classList.remove("active"); });
                (current || homeItem || items[0]).classList.add("active");
            };
            window.addEventListener("scroll", update, { passive: true });
            window.addEventListener("resize", update, { passive: true });
            update();
        });
    </script>
    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/semantic_scholar_citation_count.js' | relative_url }}"></script>
</body>
</html>
