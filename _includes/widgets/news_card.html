{% assign news_items = site.news | sort: "date" | reverse %}

<h2 class="section-heading" id="news">🔥 News</h2>
<ul class="news-list">
    {% for item in news_items limit:include.limit %}
    <li>
        <span class="news-date">[{{ item.date | date: "%Y/%m" }}]</span> {{ item.title }}
    </li>
    {% endfor %}
</ul>
